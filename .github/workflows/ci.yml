name: DEBA CI

on:
  push:
    branches: [main, chore/release-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deba-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://gkwpjtbrecoesxyoybto.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json is not committed yet; generating one for this CI run."
            npm install --no-audit --no-fund
          fi

      - name: Commit generated lockfile during bootstrap branch
        if: ${{ github.ref == 'refs/heads/chore/release-hardening' && hashFiles('package-lock.json') != '' && !contains(github.event.head_commit.message, '[lockfile-ready]') }}
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile [lockfile-ready]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check lockfile stability
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git diff --exit-code -- package-lock.json || {
              echo "package-lock.json changed during CI."
              exit 1
            }
          else
            echo "package-lock.json is not tracked yet; CI will enforce it once committed."
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
