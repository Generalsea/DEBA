name: DEBA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deba-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://gkwpjtbrecoesxyoybto.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jKwUxJFLIjftocgmbwD4CA_2S-Is3y
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json is not committed yet; using npm install temporarily."
            npm install --no-audit --no-fund
          fi

      - name: Check lockfile stability
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            git diff --exit-code -- package-lock.json || {
              echo "package-lock.json changed during CI. Commit the generated lockfile with the project."
              exit 1
            }
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          nohup npm run start -- -p 3100 > /tmp/deba-next.log 2>&1 &
          echo $! > /tmp/deba-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/deba-next.log
          exit 1

      - name: Product detail runtime smoke
        env:
          DEBA_PRODUCT_SMOKE_SLUG: أداة-منزلية-متعددة-الاستخدام-تجربة-deba
          DEBA_SMOKE_SITE_URL: http://127.0.0.1:3100
        run: node scripts/smoke-product-route.mjs

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: cat /tmp/deba-next.log
