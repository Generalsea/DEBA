name: DEBA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deba-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://gkwpjtbrecoesxyoybto.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Verify lockfile
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is required for reproducible CI."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check lockfile stability
        shell: bash
        run: |
          git diff --exit-code -- package-lock.json

      - name: Type-check
        run: npm run typecheck

      - name: Contract tests
        run: npm test

      - name: Build
        run: npm run build
