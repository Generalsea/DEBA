name: DEBA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/deba-marketplace-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm test

      - name: Public search rate-limit contract/integration tests
        run: node --test tests/public-search-rate-limit.test.mjs

      - name: Phase 4 notification contract/integration tests
        run: npm run test:phase4-notifications

      - name: Phase 4.2 deal matching contract tests
        run: npm run test:phase4-2

      - name: Playwright collection
        run: npm run e2e:list
