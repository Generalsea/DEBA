name: DEBA CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deba-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: \${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: \${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  quality:
    name: Quality / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  deploy-preview:
    name: Vercel Preview
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: \${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: \${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: \${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: \${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: \${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Vercel credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not configured; preview deployment is skipped."
          fi
      - name: Pull Vercel environment
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@59.20.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@59.20.0 build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        run: |
          url="$(npx --yes vercel@59.20.0 deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
      - name: Publish preview URL
        if: steps.credentials.outputs.ready == 'true'
        run: |
          {
            echo "## DEBA Preview"
            echo
            echo "\${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Vercel Production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: \${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: \${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: \${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: \${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: \${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Vercel credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets are not configured; production deployment is skipped."
          fi
      - name: Pull Vercel environment
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@59.20.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes vercel@59.20.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        run: |
          url="$(npx --yes vercel@59.20.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
      - name: Publish production URL
        if: steps.credentials.outputs.ready == 'true'
        run: |
          {
            echo "## DEBA Production"
            echo
            echo "\${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
