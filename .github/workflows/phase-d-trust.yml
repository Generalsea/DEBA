name: DEBA Phase D Trust
# Runs once per Phase D branch push; avoid duplicate push/PR concurrency races.

on:
  push:
    branches:
      - 'feature/phase-d-trust-phone-whatsapp-otp-20261004'
  pull_request:
    branches:
      - 'feature/phase-c1-critical-marketplace-flow-20261004'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: deba-phase-d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://gkwpjtbrecoesxyoybto.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check lockfile stability
        run: git diff --exit-code -- package-lock.json

      - name: Release preflight
        run: npm run release:preflight

      - name: Phase D contract tests
        run: npm run test:phase-d

      - name: Full regression contracts
        run: npm test

      - name: Playwright collection
        run: npm run e2e:list

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
